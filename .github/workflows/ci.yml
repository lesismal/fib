name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (gofmt / vet / staticcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      # staticcheck reads the compiler's export data through x/tools, whose
      # release can trail a Go patch release that changes that format (Go
      # 1.27.2 did, past what staticcheck v0.8.1's x/tools could read), so it
      # is built against the latest x/tools rather than the one it pins.
      - name: Install staticcheck
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/staticcheck" && cd "$RUNNER_TEMP/staticcheck"
          go mod init staticcheck-build
          go get honnef.co/go/tools/cmd/staticcheck@latest golang.org/x/tools@latest
          go install honnef.co/go/tools/cmd/staticcheck
      # The engine is split per OS, so vet and staticcheck run once per target.
      - name: go vet
        run: |
          for goos in linux darwin windows freebsd; do
            echo "::group::GOOS=$goos"
            GOOS=$goos go vet ./...
            echo "::endgroup::"
          done
      - name: staticcheck
        run: |
          for goos in linux darwin windows; do
            echo "::group::GOOS=$goos"
            GOOS=$goos "$(go env GOPATH)/bin/staticcheck" ./...
            echo "::endgroup::"
          done
      # The HTTP/3 conformance peer is a module of its own, so the checks
      # above, which are module-aware, do not reach it.
      - name: Lint the interop peer
        working-directory: http3/interop
        run: |
          go vet ./...
          "$(go env GOPATH)/bin/staticcheck" ./...
      - name: go mod tidy
        shell: bash
        run: |
          for module in . http3/interop taskpool/benchmark; do
            echo "::group::$module"
            (cd "$module" && go mod tidy -diff)
            echo "::endgroup::"
          done

  test:
    name: Test (${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.27.x', stable]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: go.mod
      - name: Build
        run: go build ./...
      - name: Test
        shell: bash
        run: |
          set +e
          go test -race -count=1 -timeout 10m -v ./... > "$RUNNER_TEMP/test.log" 2>&1
          status=$?
          grep -v -E '^(=== (RUN|PAUSE|CONT)|\s*--- PASS)' "$RUNNER_TEMP/test.log"
          skipped=$(grep -a -E -A1 -- '--- SKIP' "$RUNNER_TEMP/test.log")
          if [ -n "$skipped" ]; then
            skipped=${skipped//$'\n'/'%0A'}
            echo "::notice title=skipped tests::$skipped"
          fi
          if [ "$status" -ne 0 ]; then
            # Surface the failures as an annotation so they are readable
            # without opening the full log.
            summary=$(grep -a -E -B2 -A20 -- '--- FAIL|^panic:|^FAIL|fatal error:' "$RUNNER_TEMP/test.log" | head -c 60000)
            summary=${summary//'%'/'%25'}
            summary=${summary//$'\r'/'%0D'}
            summary=${summary//$'\n'/'%0A'}
            echo "::error title=go test failed::$summary"
          fi
          exit "$status"
      # An annotation is capped at a few kilobytes, which one failing test can
      # fill, so the whole log is kept for the failures behind it.
      - name: Upload the test log
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-log-${{ matrix.os }}-${{ matrix.go }}
          path: ${{ runner.temp }}/test.log
          if-no-files-found: ignore

  # Statement coverage across every package, counted for the whole module
  # (-coverpkg) so a package exercised only by another's tests still counts.
  # On main the total is published as a shields.io endpoint file on the
  # `badges` branch, which the README badge reads.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: go.mod
      # No -race here: the test jobs run it, and under it every coverage
      # counter is an atomic the race detector intercepts, which made a
      # transfer test twenty times slower and ran it past its deadline.
      # The counters stay atomic, as the tests count from many goroutines.
      - name: Test with coverage
        run: |
          go test -count=1 -timeout 20m -covermode=atomic \
            -coverpkg=./... -coverprofile="$RUNNER_TEMP/cover.out" ./...
      - name: Summarize
        id: cover
        run: |
          go tool cover -func="$RUNNER_TEMP/cover.out" > "$RUNNER_TEMP/cover.txt"
          total=$(awk '/^total:/ {gsub("%","",$3); print $3}' "$RUNNER_TEMP/cover.txt")
          echo "total=$total" >> "$GITHUB_OUTPUT"
          echo "### Coverage: ${total}%" >> "$GITHUB_STEP_SUMMARY"
          go tool cover -html="$RUNNER_TEMP/cover.out" -o "$RUNNER_TEMP/coverage.html"
      - uses: actions/upload-artifact@v5
        with:
          name: coverage
          path: |
            ${{ runner.temp }}/cover.out
            ${{ runner.temp }}/cover.txt
            ${{ runner.temp }}/coverage.html
      - name: Publish the badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TOTAL: ${{ steps.cover.outputs.total }}
        run: |
          color=$(awk -v t="$TOTAL" 'BEGIN{ if (t>=80) print "brightgreen"; else if (t>=70) print "green"; else if (t>=60) print "yellowgreen"; else if (t>=50) print "yellow"; else if (t>=40) print "orange"; else print "red" }')
          mkdir "$RUNNER_TEMP/badges"
          cd "$RUNNER_TEMP/badges"
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' "$TOTAL" "$color" > coverage.json
          git init -q -b badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coverage.json
          git commit -q -m "coverage: ${TOTAL}%"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" badges

  # HTTP/1.0 and HTTP/1.1 conformance: the fib server against net/http's
  # client, raw sockets and curl, the fib client against net/http's server and
  # raw servers, and SendFile under both. The peers are the standard library
  # and the curl every runner ships, so the module gains no dependency.
  http1-conformance:
    name: HTTP/1.x conformance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: go.mod
      - name: curl version
        shell: bash
        run: curl --version
      - name: Conformance tests
        shell: bash
        env:
          # Fail rather than skip the curl cases if curl is missing.
          FIB_REQUIRE_CURL: '1'
        run: |
          # The job's own shell stops on the first failure, which would take
          # the summary below with it, so failures are reported by hand.
          set +e
          go test -race -count=1 -timeout 10m -v \
            -run 'TestHTTP1Conformance|TestSendFile|TestSendableFileOf|TestResponseWriter|TestStreamRequestBody|TestChunkedDecoder|TestHoldReads|TestServerRead|TestServerIdle|TestServerTimeout|TestServerWithoutTimeouts|TestReadDeadline|TestWriteDeadline|TestZeroDeadline|TestConnectionAddresses|TestRetain|TestOnBody|TestOnCancel' \
            . ./http/ 2>&1 | tee "$RUNNER_TEMP/conformance.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            summary=$(grep -a -E -B2 -A20 -- '--- FAIL|^panic:|^FAIL|fatal error:' "$RUNNER_TEMP/conformance.log" | head -c 60000)
            summary=${summary//'%'/'%25'}
            summary=${summary//$'\r'/'%0D'}
            summary=${summary//$'\n'/'%0A'}
            echo "::error title=HTTP/1.x conformance failed::$summary"
          fi
          exit "$status"
      # An annotation is capped at a few kilobytes, which one failing test can
      # fill, so the whole log is kept for the failures behind it.
      - name: Upload the test log
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: http1-conformance-log-${{ matrix.os }}
          path: ${{ runner.temp }}/conformance.log
          if-no-files-found: ignore

  # Static files over HTTP/1.1, HTTP/2 (h2c and TLS) and HTTP/3: FileCache,
  # net/http's ServeFile and FileServer and io.Copy from a file (sendfile),
  # with big files, ranges and conditional requests, and several downloads
  # at once. go test ./... above runs these too; this job keeps them in view.
  static-files:
    name: Static files (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: go.mod
      - name: Static file tests
        run: go test -race -count=1 -timeout 10m -v -run 'TestStaticFiles|TestFileCache' ./http/ ./http3/

  # HTTP/2 conformance: the fib server against net/http's client, h2spec and
  # curl, and the fib client against net/http's server and a raw frame server.
  # h2spec is installed as a tool, like staticcheck, so the module itself
  # gains no dependency.
  http2-conformance:
    name: HTTP/2 conformance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: go.mod
      - name: Install h2spec
        run: go install github.com/summerwind/h2spec/cmd/h2spec@v2.2.1
      - name: Versions
        shell: bash
        run: |
          curl --version
          "$(go env GOPATH)/bin/h2spec" --version || true
      - name: Conformance tests
        shell: bash
        env:
          # Fail rather than skip if either peer is missing.
          FIB_REQUIRE_CURL: '1'
          FIB_REQUIRE_H2SPEC: '1'
        run: |
          set +e
          PATH="$(go env GOPATH)/bin:$PATH"
          go test -race -count=1 -timeout 10m -v \
            -run 'TestHTTP2Conformance|TestH2|TestClientHTTP2|TestClientDisableHTTP2|TestClientUnencryptedHTTP2|TestPushOnHTTP1|TestInterim|TestRequestTLS|TestConfigureTLS' \
            ./http/ 2>&1 | tee "$RUNNER_TEMP/h2conformance.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            summary=$(grep -a -E -B2 -A20 -- '--- FAIL|^panic:|^FAIL|fatal error:' "$RUNNER_TEMP/h2conformance.log" | head -c 60000)
            summary=${summary//'%'/'%25'}
            summary=${summary//$'\r'/'%0D'}
            summary=${summary//$'\n'/'%0A'}
            echo "::error title=HTTP/2 conformance failed::$summary"
          fi
          exit "$status"
      # An annotation is capped at a few kilobytes, which one failing test can
      # fill, so the whole log is kept for the failures behind it.
      - name: Upload the test log
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: http2-conformance-log-${{ matrix.os }}
          path: ${{ runner.temp }}/h2conformance.log
          if-no-files-found: ignore
      - name: HPACK tests
        # HTTP/2 header compression, checked against RFC 7541's own vectors.
        run: go test -race -count=1 ./hpack/

  # A standalone h2spec report. http2-conformance above already runs h2spec
  # inside go test and fails on any case it reports, but only keeps its last
  # summary line; this job runs the same tool directly against
  # examples/http2only's server, over h2c and h2, and keeps h2spec's own
  # case-by-case log and JUnit report as an artifact together with a
  # pass/fail summary and conclusion in the job itself.
  h2spec-report:
    name: HTTP/2 conformance report (h2spec)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: go.mod
      - name: Install h2spec
        run: go install github.com/summerwind/h2spec/cmd/h2spec@v2.2.1
      - name: Versions
        run: '"$(go env GOPATH)/bin/h2spec" --version'
      - name: Build the HTTP/2-only example server
        run: go build -o "$RUNNER_TEMP/h2only-server" ./examples/http2only/server
      - name: Run h2spec against h2c and h2, and report the result
        shell: bash
        run: |
          h2spec="$(go env GOPATH)/bin/h2spec"
          reports="$RUNNER_TEMP/h2spec-reports"
          mkdir -p "$reports"
          overall=0

          # Starts the example server in mode $1 on port $2 with the extra
          # server flags in $3+, runs h2spec's full default suite against it,
          # and appends "$1|tests|passed|skipped|failed|result" to
          # summary.txt for the table below.
          run_mode() {
            local name="$1" port="$2"
            shift 2
            "$RUNNER_TEMP/h2only-server" -addr "127.0.0.1:$port" "$@" \
              > "$reports/$name-server.log" 2>&1 &
            local pid=$!
            for _ in $(seq 50); do
              nc -z 127.0.0.1 "$port" && break
              sleep 0.2
            done
            local h2spec_args=(-h 127.0.0.1 -p "$port" --timeout 5 -v -j "$reports/$name-junit.xml")
            if [ "$name" = "h2" ]; then
              h2spec_args+=(-t -k)
            fi
            # h2spec exits non-zero on a reported failure, which is what
            # this job is for, so it must not stop the shell.
            local status=0
            "$h2spec" "${h2spec_args[@]}" > "$reports/$name.log" 2>&1 || status=$?
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true

            echo "::group::h2spec ($name)"
            cat "$reports/$name.log"
            echo "::endgroup::"

            local summary counts result
            summary=$(tail -n 1 "$reports/$name.log")
            counts=$(grep -Eo '[0-9]+' <<<"$summary" | tr '\n' '|')
            result=success
            if [ "$status" -ne 0 ] || ! grep -q '0 failed' <<<"$summary"; then
              result=failure
              overall=1
            fi
            echo "$name|$counts$result" >> "$reports/summary.txt"
          }

          run_mode h2c 18080
          run_mode h2 18443 -tls -cert-out "$reports/cert.pem"

          {
            echo '### h2spec HTTP/2 conformance report'
            echo
            echo '| Mode | Tests | Passed | Skipped | Failed | Result |'
            echo '|------|------:|-------:|--------:|-------:|:------:|'
            while IFS='|' read -r name tests passed skipped failed result; do
              icon=$([ "$result" = success ] && echo ✅ || echo ❌)
              echo "| $name | ${tests:-?} | ${passed:-?} | ${skipped:-?} | ${failed:-?} | $icon $result |"
            done < "$reports/summary.txt"
            echo
            if [ "$overall" -eq 0 ]; then
              echo '**Conclusion: all h2spec conformance cases passed.**'
            else
              echo '**Conclusion: h2spec reported failures — see the logs above and the h2spec-report artifact.**'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$overall"
      - name: Upload h2spec report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: h2spec-report
          path: ${{ runner.temp }}/h2spec-reports
          if-no-files-found: error

  # HTTP/3 conformance: the fib server against a quic-go client, the fib
  # client against a quic-go server, and both against raw QUIC peers for the
  # frames a well-behaved implementation never sends. The quic-go peer is a
  # module of its own under http3/interop, built as a program the tests
  # run, so the fib module itself gains no dependency.
  http3-conformance:
    name: HTTP/3 conformance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: |
            go.mod
            http3/interop/go.sum
      - name: Build the interop peer
        working-directory: http3/interop
        run: |
          go vet ./...
          go build ./...
      - name: Conformance tests
        shell: bash
        env:
          # Fail rather than skip if the peer cannot be built.
          FIB_REQUIRE_H3_INTEROP: '1'
        run: |
          set +e
          go test -race -count=1 -timeout 10m -v ./http3/... 2>&1 | tee "$RUNNER_TEMP/h3conformance.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            summary=$(grep -a -E -B2 -A20 -- '--- FAIL|^panic:|^FAIL|fatal error:' "$RUNNER_TEMP/h3conformance.log" | head -c 60000)
            summary=${summary//'%'/'%25'}
            summary=${summary//$'\r'/'%0D'}
            summary=${summary//$'\n'/'%0A'}
            echo "::error title=HTTP/3 conformance failed::$summary"
          fi
          exit "$status"
      # An annotation is capped at a few kilobytes, which one failing test can
      # fill, so the whole log is kept for the failures behind it.
      - name: Upload the test log
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: http3-conformance-log-${{ matrix.os }}
          path: ${{ runner.temp }}/h3conformance.log
          if-no-files-found: ignore

  # The parsers all take bytes from the network, so each gets a short fuzz
  # run: HTTP/1 requests, HTTP/2 frames and HPACK, HTTP/3 frames, requests
  # and QPACK, and QUIC packet headers, transport parameters and frames.
  # Anything that fails is uploaded as a seed for the corpus.
  fuzz:
    name: Fuzz the parsers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: go.mod
      - name: Fuzz
        shell: bash
        run: |
          set -e
          for entry in \
            ./http:FuzzParser \
            ./http:FuzzH2Frame \
            ./hpack:FuzzDecode \
            ./hpack:FuzzRoundTrip \
            ./hpack:FuzzHuffman \
            ./http3:FuzzFrameParser \
            ./http3:FuzzNewRequest \
            ./http3/qpack:FuzzDecode \
            ./http3/qpack:FuzzRoundTrip \
            ./http3/quic:FuzzParseHeader \
            ./http3/quic:FuzzParseParams \
            ./http3/quic:FuzzFrames; do
            package=${entry%%:*}
            target=${entry##*:}
            echo "::group::$package $target"
            go test -run "^$target$" -fuzz "^$target$" -fuzztime 20s "$package"
            echo "::endgroup::"
          done
      - name: Upload the inputs that failed
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: fuzz-failures
          path: "**/testdata/fuzz/**"
          if-no-files-found: ignore

  # The taskpool comparison against nbio, ants and gopool. It is a module of
  # its own under taskpool/benchmark, so the pools it compares with never
  # become fib's dependencies. Shared runners are too noisy for the numbers
  # to gate anything: the job fails only if a benchmark does, and keeps the
  # raw output and the summary for comparing runs by hand.
  taskpool-benchmark:
    name: Taskpool benchmark (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: |
            go.mod
            taskpool/benchmark/go.sum
      # go mod tidy -diff runs in the lint job: on Windows the checkout's CRLF
      # line endings make it report every line of go.mod as changed.
      - name: Vet
        working-directory: taskpool/benchmark
        run: go vet ./...
      - name: Benchmark
        if: runner.os != 'Windows'
        working-directory: taskpool/benchmark
        run: ./bench.sh -o "$RUNNER_TEMP/taskpool-bench.txt"
      - name: Benchmark
        if: runner.os == 'Windows'
        working-directory: taskpool/benchmark
        shell: pwsh
        run: ./bench.ps1 -Out "$env:RUNNER_TEMP/taskpool-bench.txt"
      - name: Summary
        if: success()
        shell: bash
        working-directory: taskpool/benchmark
        run: |
          {
            echo "### Taskpool benchmark (${{ matrix.os }}, $(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo "$NUMBER_OF_PROCESSORS") CPUs)"
            echo
            go run ./summarize "$RUNNER_TEMP/taskpool-bench.txt"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: taskpool-benchmark-${{ matrix.os }}
          path: ${{ runner.temp }}/taskpool-bench.txt
          if-no-files-found: ignore

  # Known vulnerabilities in the standard library the module builds against,
  # and in the conformance peer's dependencies.
  vulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: go.mod
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Scan
        shell: bash
        run: |
          set -e
          for module in . http3/interop; do
            echo "::group::$module"
            (cd "$module" && "$(go env GOPATH)/bin/govulncheck" ./...)
            echo "::endgroup::"
          done

  cross-build:
    name: Cross build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: go.mod
      - name: Build all targets
        run: |
          # freebsd exercises the portable fallback engine.
          for target in \
            linux/amd64 linux/386 linux/arm64 linux/arm linux/riscv64 linux/loong64 \
            darwin/amd64 darwin/arm64 \
            windows/amd64 windows/arm64 windows/386 \
            freebsd/amd64; do
            echo "building $target"
            GOOS=${target%/*} GOARCH=${target#*/} go build ./...
          done

  c:
    name: C (${{ matrix.cc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: make -C c CC=${{ matrix.cc }} CFLAGS="-O2 -g -std=c11 -Wall -Wextra -Wpedantic -Werror"
      - name: Integration test
        run: make -C c test CC=${{ matrix.cc }}

  autobahn:
    name: Autobahn WebSocket (ws://)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: go.mod
      - name: Build echo server
        run: go build -o "$RUNNER_TEMP/websocket_server" ./examples/websocket/nontls/server
      - name: Start echo server
        run: |
          "$RUNNER_TEMP/websocket_server" -addr 127.0.0.1:9001 -compress > "$RUNNER_TEMP/server.log" 2>&1 &
          for _ in $(seq 50); do
            nc -z 127.0.0.1 9001 && exit 0
            sleep 0.2
          done
          echo "server did not start"
          cat "$RUNNER_TEMP/server.log"
          exit 1
      # TLS is not covered. run.sh splits the cases across several wstest
      # processes, merges their reports into reports/servers and checks it.
      - name: Run fuzzingclient
        run: |
          # Record memory use, so a run that is killed shows who grew.
          (while sleep 30; do
            echo "$(date -u +%T) $(free -m | awk '/^Mem:/ {print "used=" $3 "MiB avail=" $7 "MiB"}')" \
              "server_rss=$(ps -o rss= -C websocket_server | tr -d ' ')KiB" \
              "$(docker stats --no-stream --format '{{.Name}}={{.MemUsage}}' | tr '\n' ' ')"
          done) > "$RUNNER_TEMP/memory.log" 2>&1 &
          .github/autobahn/run.sh reports
      - name: Diagnostics
        if: failure()
        run: |
          tail -n 40 "$RUNNER_TEMP/memory.log" || true
          sudo dmesg | grep -iE 'out of memory|oom|killed process' | tail -n 20 || true
          tail -n 40 "$RUNNER_TEMP/server.log" || true
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: autobahn-report
          path: reports/servers
          if-no-files-found: ignore
